services:
  youtrack-mcp:
    image: ${APP_IMAGE:-youtrack-mcp-tunnel:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TUNNEL_CLIENT_VERSION: ${TUNNEL_CLIENT_VERSION:-v0.0.10}
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/youtrack-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_ADDR: 0.0.0.0:8080
      MCP_INTERNAL_ADDR: 0.0.0.0:8081
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      YOUTRACK_URL: ${YOUTRACK_URL}
      YOUTRACK_TOKEN: ${YOUTRACK_TOKEN}
      RUST_LOG: ${MCP_LOG_LEVEL:-info}
    expose:
      - "8080"
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  openai-tunnel:
    image: ${APP_IMAGE:-youtrack-mcp-tunnel:local}
    restart: unless-stopped
    depends_on:
      youtrack-mcp:
        condition: service_healthy
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://youtrack-mcp:8081/mcp
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
